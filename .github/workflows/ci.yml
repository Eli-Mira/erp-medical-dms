name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms-dev
          POSTGRES_DB: medical_dms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dms"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install -r requirements.txt pytest
      - name: Apply database migrations
        run: alembic upgrade head
      - name: App boots + tests
        run: |
          python -c "from fastapi.testclient import TestClient; from app.main import app; r=TestClient(app).get('/health'); assert r.status_code==200, r.text; print('health ok')"
          pytest -q
