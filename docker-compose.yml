services:
  db:
    image: postgres:16-alpine
    container_name: med_dms_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: dms-dev
      POSTGRES_DB: medical_dms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: med_dms_app
    restart: unless-stopped
    env_file: .env.dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
